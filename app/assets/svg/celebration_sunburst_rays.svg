<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%" id="celebration-sunburst-svg">
    <defs>
        <radialGradient id="cartoonRayGrad" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#FF9330" stop-opacity="0.60" />
            <stop offset="35%" stop-color="#FFA84A" stop-opacity="0.45" />
            <stop offset="65%" stop-color="#FFC57A" stop-opacity="0.30" />
            <stop offset="90%" stop-color="#FFE1B3" stop-opacity="0.10" />
            <stop offset="100%" stop-color="#FFF2DE" stop-opacity="0" />
        </radialGradient>
        <radialGradient id="cartoonCenterHalo" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#FFEDD5" stop-opacity="0.75" />
            <stop offset="45%" stop-color="#FED7AA" stop-opacity="0.45" />
            <stop offset="80%" stop-color="#FDBA74" stop-opacity="0.15" />
            <stop offset="100%" stop-color="#FB923C" stop-opacity="0" />
        </radialGradient>
        <mask id="burstFadeMask">
            <radialGradient id="maskGrad" cx="50%" cy="50%" r="50%">
                <stop offset="0%" stop-color="white" stop-opacity="1" />
                <stop offset="75%" stop-color="white" stop-opacity="1" />
                <stop offset="95%" stop-color="white" stop-opacity="0.3" />
                <stop offset="100%" stop-color="white" stop-opacity="0" />
            </radialGradient>
            <circle cx="300" cy="300" r="290" fill="url(#maskGrad)" />
        </mask>
    </defs>
    <style><![CDATA[
        #cartoon-rays-wheel {
            transform-origin: 300px 300px;
            animation: slowCartoonSpin 52s linear infinite;
        }
        #cartoon-halo-pulse {
            transform-origin: 300px 300px;
            animation: gentleHaloPulse 4s ease-in-out infinite alternate;
        }
        .cartoon-sparkle {
            transform-origin: 0px 0px;
            animation: gentleSparkle 3s ease-in-out infinite;
        }
        @keyframes slowCartoonSpin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        @keyframes gentleHaloPulse {
            0% { transform: scale(0.92); opacity: 0.7; }
            100% { transform: scale(1.06); opacity: 0.95; }
        }
        @keyframes gentleSparkle {
            0%, 100% { transform: scale(0.2) rotate(0deg); opacity: 0.15; }
            50% { transform: scale(1.1) rotate(45deg); opacity: 1; }
        }
    ]]></style>
    <g id="burst-container" mask="url(#burstFadeMask)">
        <g id="cartoon-rays-wheel">
            <path d="M 300.0,300.0 L 590.0,300.0 A 290.0,290.0 0 0,1 582.7,364.5 Z M 300.0,300.0 L 561.3,425.8 A 290.0,290.0 0 0,1 526.7,480.8 Z M 300.0,300.0 L 480.8,526.7 A 290.0,290.0 0 0,1 425.8,561.3 Z M 300.0,300.0 L 364.5,582.7 A 290.0,290.0 0 0,1 300.0,590.0 Z M 300.0,300.0 L 235.5,582.7 A 290.0,290.0 0 0,1 174.2,561.3 Z M 300.0,300.0 L 119.2,526.7 A 290.0,290.0 0 0,1 73.3,480.8 Z M 300.0,300.0 L 38.7,425.8 A 290.0,290.0 0 0,1 17.3,364.5 Z M 300.0,300.0 L 10.0,300.0 A 290.0,290.0 0 0,1 17.3,235.5 Z M 300.0,300.0 L 38.7,174.2 A 290.0,290.0 0 0,1 73.3,119.2 Z M 300.0,300.0 L 119.2,73.3 A 290.0,290.0 0 0,1 174.2,38.7 Z M 300.0,300.0 L 235.5,17.3 A 290.0,290.0 0 0,1 300.0,10.0 Z M 300.0,300.0 L 364.5,17.3 A 290.0,290.0 0 0,1 425.8,38.7 Z M 300.0,300.0 L 480.8,73.3 A 290.0,290.0 0 0,1 526.7,119.2 Z M 300.0,300.0 L 561.3,174.2 A 290.0,290.0 0 0,1 582.7,235.5 Z" fill="url(#cartoonRayGrad)" />
        </g>
        <circle id="cartoon-halo-pulse" cx="300" cy="300" r="150.8" fill="url(#cartoonCenterHalo)" />
    </g>
    <g id="sparkles-layer">
        <g transform="translate(160,180)"><path class="cartoon-sparkle" style="animation-delay: 0.0s;" d="M 0,-18 Q 0,0 18,0 Q 0,0 0,18 Q 0,0 -18,0 Q 0,0 0,-18 Z" fill="#FB923C" /></g>
        <g transform="translate(450,190)"><path class="cartoon-sparkle" style="animation-delay: 1.2s;" d="M 0,-20 Q 0,0 20,0 Q 0,0 0,20 Q 0,0 -20,0 Q 0,0 0,-20 Z" fill="#F59E0B" /></g>
        <g transform="translate(140,400)"><path class="cartoon-sparkle" style="animation-delay: 2.0s;" d="M 0,-16 Q 0,0 16,0 Q 0,0 0,16 Q 0,0 -16,0 Q 0,0 0,-16 Z" fill="#EA580C" /></g>
        <g transform="translate(440,420)"><path class="cartoon-sparkle" style="animation-delay: 0.8s;" d="M 0,-20 Q 0,0 20,0 Q 0,0 0,20 Q 0,0 -20,0 Q 0,0 0,-20 Z" fill="#F97316" /></g>
        <g transform="translate(300,100)"><path class="cartoon-sparkle" style="animation-delay: 1.6s;" d="M 0,-18 Q 0,0 18,0 Q 0,0 0,18 Q 0,0 -18,0 Q 0,0 0,-18 Z" fill="#F59E0B" /></g>
        <g transform="translate(300,500)"><path class="cartoon-sparkle" style="animation-delay: 2.4s;" d="M 0,-16 Q 0,0 16,0 Q 0,0 0,16 Q 0,0 -16,0 Q 0,0 0,-16 Z" fill="#FB923C" /></g>
    </g>
</svg>