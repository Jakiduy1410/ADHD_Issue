<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 470" width="100%" height="100%" id="pompompurin-base-svg">
    <style><![CDATA[
        /* ==========================================================
           POMPOMPURIN CLASSIC - SOFT JELLY PUDDING (NỀN TRONG SUỐT)
           Thân nhún siêu đàn hồi như thạch pudding, tai lúc lắc & ngón tay chỉ
           ========================================================== */
        
        #char-rig {
            transform-origin: 250px 430px;
            animation: jelly-pudding-breathe 2.8s ease-in-out infinite;
            will-change: transform;
        }
        #left-ear {
            transform-origin: 155px 205px;
            animation: jelly-ear-left 2.8s ease-in-out infinite;
            will-change: transform;
        }
        #right-ear {
            transform-origin: 345px 200px;
            animation: jelly-ear-right 2.8s ease-in-out infinite;
            will-change: transform;
        }
        #beret-hat {
            transform-origin: 250px 145px;
            animation: jelly-hat 2.8s ease-in-out infinite;
            will-change: transform;
        }
        #nerd-glasses {
            transform-origin: 250px 235px;
            animation: jelly-glasses 2.8s ease-in-out infinite;
            will-change: transform;
        }
        #pointing-hand {
            transform-origin: 175px 330px;
            animation: jelly-hand 2.8s ease-in-out infinite;
            will-change: transform;
        }
        #ground-shadow {
            transform-origin: 250px 440px;
            animation: jelly-shadow 2.8s ease-in-out infinite;
            will-change: transform;
        }

        /* Hoạt ảnh nhún thạch flan sóng sánh siêu nảy */
        @keyframes jelly-pudding-breathe {
            0%, 100% { transform: scale(1, 1) translateY(0px); }
            25% { transform: scale(1.025, 0.975) translateY(3.5px) rotate(-1deg); }
            50% { transform: scale(0.985, 1.015) translateY(-2px) rotate(0.8deg); }
            75% { transform: scale(1.015, 0.985) translateY(1.5px) rotate(-0.5deg); }
        }
        @keyframes jelly-ear-left {
            0%, 100% { transform: rotate(0deg); }
            25% { transform: rotate(-5deg); }
            50% { transform: rotate(3deg); }
            75% { transform: rotate(-2deg); }
        }
        @keyframes jelly-ear-right {
            0%, 100% { transform: rotate(0deg); }
            25% { transform: rotate(5deg); }
            50% { transform: rotate(-3deg); }
            75% { transform: rotate(2deg); }
        }
        @keyframes jelly-hat {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            25% { transform: translateY(2.5px) rotate(-2deg); }
            50% { transform: translateY(-2px) rotate(1.5deg); }
        }
        @keyframes jelly-glasses {
            0%, 100% { transform: translateY(0px); }
            25% { transform: translateY(1.5px); }
            50% { transform: translateY(-1px); }
        }
        @keyframes jelly-hand {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            20% { transform: translateY(-8px) rotate(-3.5deg); }
            40% { transform: translateY(-2px) rotate(-1deg); }
            55% { transform: translateY(-9px) rotate(-4.2deg); }
            70% { transform: translateY(1.5px) rotate(0.8deg); }
            85% { transform: translateY(-6px) rotate(-2.8deg); }
        }
        @keyframes jelly-shadow {
            0%, 100% { transform: scale(1); opacity: 0.22; }
            25% { transform: scale(1.05, 0.96); opacity: 0.28; }
            50% { transform: scale(0.96, 1.03); opacity: 0.18; }
        }

        /* Tự động chớp mắt & mỉm cười tự nhiên */
        @keyframes eye-blink-anim {
            0%, 88%, 96%, 100% { opacity: 0; }
            91%, 93% { opacity: 1; }
        }
        @keyframes eye-open-anim {
            0%, 88%, 96%, 100% { opacity: 1; }
            91%, 93% { opacity: 0; }
        }
        #eyes-open {
            animation: eye-open-anim 3.8s infinite;
        }
        #eyes-blink {
            opacity: 0;
            animation: eye-blink-anim 3.8s infinite;
        }

        /* Khẩu hình nói chuyện tự nhiên (Lip Sync Speech Animation) */
        #mouth-closed {
            animation: talk-mouth-closed 3.2s infinite;
        }
        #mouth-half {
            animation: talk-mouth-half 3.2s infinite;
        }
        #mouth-wide {
            animation: talk-mouth-wide 3.2s infinite;
        }

        @keyframes talk-mouth-closed {
            0%, 9.9% { opacity: 1; }
            10%, 67.9% { opacity: 0; }
            68%, 75.9% { opacity: 1; }
            76%, 93.9% { opacity: 0; }
            94%, 100% { opacity: 1; }
        }

        @keyframes talk-mouth-half {
            0%, 9.9% { opacity: 0; }
            10%, 21.9% { opacity: 1; }
            22%, 33.9% { opacity: 0; }
            34%, 45.9% { opacity: 1; }
            46%, 57.9% { opacity: 0; }
            58%, 67.9% { opacity: 1; }
            68%, 75.9% { opacity: 0; }
            76%, 85.9% { opacity: 1; }
            86%, 100% { opacity: 0; }
        }

        @keyframes talk-mouth-wide {
            0%, 21.9% { opacity: 0; }
            22%, 33.9% { opacity: 1; }
            34%, 45.9% { opacity: 0; }
            46%, 57.9% { opacity: 1; }
            58%, 85.9% { opacity: 0; }
            86%, 93.9% { opacity: 1; }
            94%, 100% { opacity: 0; }
        }
    ]]></style>

                    <defs>
                        <!-- Gradient thân vàng -->
                        <radialGradient id="bodyYellowGrad" gradientUnits="userSpaceOnUse" cx="250" cy="275" r="195" fx="235" fy="245">
                            <stop offset="0%" stop-color="#fff9a6" />
                            <stop offset="72%" stop-color="#fdf082" />
                            <stop offset="91%" stop-color="#eee070" />
                            <stop offset="100%" stop-color="#dec756" />
                        </radialGradient>

                        <!-- Gradient mũ nồi -->
                        <linearGradient id="beretGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#d5ad80" />
                            <stop offset="65%" stop-color="#c69c6d" />
                            <stop offset="100%" stop-color="#ab8052" />
                        </linearGradient>

                        <!-- Gradient bàn tay -->
                        <linearGradient id="handEmojiGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                            <stop offset="0%" stop-color="#ffde59" />
                            <stop offset="55%" stop-color="#ffc830" />
                            <stop offset="100%" stop-color="#f59e0b" />
                        </linearGradient>

                        <!-- Tròng kính bóng -->
                        <linearGradient id="lensShine" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#ffffff" stop-opacity="0.45" />
                            <stop offset="50%" stop-color="#ffffff" stop-opacity="0.08" />
                            <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
                        </linearGradient>
                    </defs>

                    <!-- Bóng đổ dưới đất -->
                    <ellipse id="ground-shadow" cx="250" cy="442" rx="115" ry="16" fill="#1c1917" opacity="0.22" />

                    <!-- Khung Rig toàn thân -->
                    <g id="char-rig">
                        
                        <!-- Hai bàn chân nhỏ -->
                        <g id="feet-group">
                            <path d="M 176 404 C 170 434, 185 442, 200 432 C 206 426, 209 415, 208 408 Z" 
                                  fill="url(#bodyYellowGrad)" stroke="#141413" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" />
                            <path d="M 324 404 C 330 434, 315 442, 300 432 C 294 426, 291 415, 292 408 Z" 
                                  fill="url(#bodyYellowGrad)" stroke="#141413" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" />
                        </g>

                        <!-- Mũ nồi nâu -->
                        <g id="beret-hat">
                            <path d="M 237 104 C 236 82, 259 80, 259 104 Z" 
                                  fill="url(#beretGrad)" stroke="#141413" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" />
                            <path d="M 168 164 C 175 112, 222 100, 252 100 C 282 100, 315 114, 326 164 Z" 
                                  fill="url(#beretGrad)" stroke="#141413" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" />
                        </g>

                        <!-- Thân và đôi tai cụp -->
                        <g id="main-body-group">
                            <!-- Thân tròn -->
                            <path d="M 170 164 C 205 142, 290 142, 325 164 C 375 196, 404 252, 400 315 C 396 382, 336 420, 250 420 C 164 420, 104 382, 100 315 C 96 252, 125 196, 170 164 Z" 
                                  fill="url(#bodyYellowGrad)" stroke="#141413" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" />

                            <!-- Tai Trái -->
                            <g id="left-ear">
                                <path d="M 174 163 C 120 144, 52 162, 42 205 C 33 242, 74 260, 108 242 C 126 232, 134 218, 145 216 L 182 185 Z" 
                                      fill="url(#bodyYellowGrad)" stroke="none" />
                                <path d="M 172 163 C 120 144, 52 162, 42 205 C 33 242, 74 260, 108 242 C 126 232, 134 218, 143 216" 
                                      fill="none" stroke="#141413" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" />
                            </g>

                            <!-- Tai Phải -->
                            <g id="right-ear">
                                <path d="M 322 162 C 378 134, 448 148, 460 192 C 470 228, 434 248, 395 232 C 375 224, 366 208, 355 208 L 315 182 Z" 
                                      fill="url(#bodyYellowGrad)" stroke="none" />
                                <path d="M 323 162 C 378 134, 448 148, 460 192 C 470 228, 434 248, 395 232 C 375 224, 366 208, 356 208" 
                                      fill="none" stroke="#141413" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" />
                            </g>

                            <!-- Lớp phủ che vết giao tai -->
                            <path d="M 172 166 C 205 145, 290 145, 323 166 C 371 197, 399 252, 395 315 C 391 379, 333 416, 250 416 C 167 416, 109 379, 105 315 C 101 252, 129 197, 172 166 Z" 
                                  fill="url(#bodyYellowGrad)" stroke="none" />
                        </g>

                        <!-- Tay phải nhỏ -->
                        <g id="left-arm">
                            <path d="M 353 298 C 338 318, 344 335, 366 315" 
                                  fill="none" stroke="#141413" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" />
                        </g>

                        <!-- Nhóm Miệng -->
                        <g id="mouth-group">
                            <!-- Miệng 1: Khép mỉm cười W + 2 răng -->
                            <g id="mouth-closed">
                                <path d="M 239 266 C 239 272, 245 272, 245 266 C 245 272, 251 272, 251 266 Z" 
                                      fill="#ffffff" stroke="#57534e" stroke-width="2" stroke-linejoin="round" />
                                <path d="M 224 256 C 230 270, 244 268, 245 247 C 246 268, 260 270, 266 258" 
                                      fill="none" stroke="#141413" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
                            </g>

                            <!-- Miệng 2: Mở vừa (Âm tiết trung bình) - Khớp khít mép dưới chữ W -->
                            <g id="mouth-half">
                                <path d="M 231 264 C 231 275, 259 275, 259 264 C 253 259, 248 252, 245 250 C 242 252, 237 259, 231 264 Z" 
                                      fill="#be123c" stroke="#141413" stroke-width="4.5" stroke-linejoin="round" />
                                <path d="M 237 271 C 241 267, 249 267, 253 271 C 249 275, 241 275, 237 271 Z" fill="#fda4af" />
                                <rect x="240.5" y="258" width="4.2" height="6.5" rx="1.5" fill="#ffffff" stroke="#57534e" stroke-width="1.2" />
                                <rect x="245.3" y="258" width="4.2" height="6.5" rx="1.5" fill="#ffffff" stroke="#57534e" stroke-width="1.2" />
                                <path d="M 224 256 C 230 270, 244 268, 245 247 C 246 268, 260 270, 266 258" 
                                      fill="none" stroke="#141413" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
                            </g>

                            <!-- Miệng 3: Mở to (Âm tiết mạnh) - Nằm gọn chuẩn xác dưới 2 vòng cung chữ W, không bị tràn -->
                            <g id="mouth-wide">
                                <path d="M 229 264 C 229 281, 261 281, 261 264 C 254 259, 248 251, 245 249 C 242 251, 236 259, 229 264 Z" 
                                      fill="#9f1239" stroke="#141413" stroke-width="5" stroke-linejoin="round" />
                                <path d="M 235 277 C 240 270, 250 270, 255 277 C 251 282, 239 282, 235 277 Z" fill="#fb7185" />
                                <rect x="240" y="258" width="4.6" height="7.5" rx="1.5" fill="#ffffff" stroke="#57534e" stroke-width="1.2" />
                                <rect x="245.4" y="258" width="4.6" height="7.5" rx="1.5" fill="#ffffff" stroke="#57534e" stroke-width="1.2" />
                                <path d="M 224 256 C 230 270, 244 268, 245 247 C 246 268, 260 270, 266 258" 
                                      fill="none" stroke="#141413" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
                            </g>
                        </g>

                        <!-- Đôi mắt kính tròn -->
                        <g id="nerd-glasses">
                            <path d="M 152 204 C 175 198, 215 202, 232 214 C 238 242, 224 266, 192 266 C 158 266, 146 242, 152 204 Z" fill="url(#lensShine)" />
                            <path d="M 268 214 C 285 202, 325 198, 348 204 C 354 242, 342 266, 308 266 C 276 266, 262 242, 268 214 Z" fill="url(#lensShine)" />

                            <g id="eyes-open">
                                <circle cx="212" cy="222" r="5" fill="#141413" />
                                <circle cx="288" cy="225" r="5" fill="#141413" />
                            </g>
                            <g id="eyes-blink">
                                <path d="M 205 222 L 219 222" stroke="#141413" stroke-width="3.5" stroke-linecap="round" />
                                <path d="M 281 225 L 295 225" stroke="#141413" stroke-width="3.5" stroke-linecap="round" />
                            </g>

                            <!-- Gọng kính -->
                            <path d="M 142 198 C 175 194, 218 197, 236 207 C 242 242, 226 269, 190 269 C 154 269, 140 242, 145 206 Z" 
                                  fill="none" stroke="#141413" stroke-width="9.5" stroke-linejoin="round" />
                            <path d="M 264 207 C 282 197, 325 194, 358 198 C 360 242, 346 269, 310 269 C 274 269, 258 242, 264 207 Z" 
                                  fill="none" stroke="#141413" stroke-width="9.5" stroke-linejoin="round" />
                            <path d="M 233 208 Q 250 202 267 208" fill="none" stroke="#141413" stroke-width="10.5" stroke-linecap="round" />
                            <ellipse cx="148" cy="204" rx="5" ry="2.3" fill="#ffffff" />
                            <ellipse cx="352" cy="204" rx="5" ry="2.3" fill="#ffffff" />
                        </g>

                        <!-- Tay chỉ ngón trỏ lên (Thực ra thì...) -->
                        <g id="pointing-hand">
                            <ellipse cx="176" cy="340" rx="24" ry="26" fill="#d4b84a" opacity="0.45" />
                            <path d="M 183 279 C 183 271, 195 271, 195 279 L 195 316 C 198 320, 199 332, 196 341 C 192 353, 180 359, 169 359 C 156 359, 148 349, 148 334 L 148 315 C 148 308, 158 308, 158 314 L 158 309 C 158 302, 169 302, 169 309 L 169 306 C 169 299, 181 299, 181 307 L 183 279 Z" 
                                  fill="url(#handEmojiGrad)" stroke="#d97706" stroke-width="3.2" stroke-linejoin="round" />
                            <rect x="149" y="309" width="10.5" height="20" rx="5" fill="url(#handEmojiGrad)" stroke="#d97706" stroke-width="2.6" />
                            <rect x="159.5" y="304" width="11" height="22" rx="5.5" fill="url(#handEmojiGrad)" stroke="#d97706" stroke-width="2.6" />
                            <rect x="170.5" y="301" width="11.5" height="23" rx="5.5" fill="url(#handEmojiGrad)" stroke="#d97706" stroke-width="2.6" />
                            <path d="M 155 328 C 155 320, 172 318, 184 323 C 190 326, 189 335, 181 336 C 171 337, 158 336, 155 328 Z" 
                                  fill="#ffdf5d" stroke="#d97706" stroke-width="2.6" stroke-linecap="round" />
                            <path d="M 187 277 L 187 298" stroke="#fffbeb" stroke-width="2.2" stroke-linecap="round" opacity="0.8" />
                        </g>

                    </g>
                
</svg>