<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="100%" height="100%" id="sunburst-orange-white-fullscreen-svg">
    <defs>
        <!-- ORANGE - WHITE CARTOON GRADIENT: Tông cam pastel ấm áp nổi bật hoàn hảo trên nền trắng -->
        <radialGradient id="orangeWhiteRayGrad" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#FF9330" stop-opacity="0.60" />
            <stop offset="35%" stop-color="#FFA84A" stop-opacity="0.45" />
            <stop offset="65%" stop-color="#FFC57A" stop-opacity="0.30" />
            <stop offset="90%" stop-color="#FFE1B3" stop-opacity="0.10" />
            <stop offset="100%" stop-color="#FFF2DE" stop-opacity="0" />
        </radialGradient>

        <!-- Soft warm peach halo at center -->
        <radialGradient id="orangeWhiteCenterHalo" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#FFEDD5" stop-opacity="0.75" />
            <stop offset="45%" stop-color="#FED7AA" stop-opacity="0.45" />
            <stop offset="80%" stop-color="#FDBA74" stop-opacity="0.15" />
            <stop offset="100%" stop-color="#FB923C" stop-opacity="0" />
        </radialGradient>
    </defs>

    <style><![CDATA[
        /* ==========================================================
           ORANGE - WHITE CARTOON SUNBURST (TÔNG CAM - TRẮNG DỊU MẮT)
           14 tia cam pastel • Nổi bật tuyệt đẹp trên nền app trắng
           Tốc độ xoay chậm rãi 52s • Không chói lóa
           ========================================================== */

        #cartoon-rays-wheel {
            transform-origin: 500px 500px;
            animation: slowCartoonSpin 52s linear infinite;
        }

        #cartoon-halo-pulse {
            transform-origin: 500px 500px;
            animation: gentleHaloPulse 4s ease-in-out infinite alternate;
        }

        .cartoon-sparkle {
            transform-origin: 0px 0px;
            animation: gentleSparkle 3s ease-in-out infinite;
        }

        @keyframes slowCartoonSpin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        @keyframes gentleHaloPulse {
            0% { transform: scale(0.92); opacity: 0.7; }
            100% { transform: scale(1.06); opacity: 0.95; }
        }

        @keyframes gentleSparkle {
            0%, 100% { transform: scale(0.2) rotate(0deg); opacity: 0.15; }
            50% { transform: scale(1.1) rotate(45deg); opacity: 1; }
        }
    ]]></style>

    <g id="orange-white-sunburst-layer">
        <!-- 14 tia nan quạt cam pastel bản to xoay chậm -->
        <g id="cartoon-rays-wheel">
            <path d="M 500.0,500.0 L 1400.0,500.0 A 900.0,900.0 0 0,1 1377.4,700.3 Z M 500.0,500.0 L 1310.9,890.5 A 900.0,900.0 0 0,1 1203.6,1061.1 Z M 500.0,500.0 L 1061.1,1203.6 A 900.0,900.0 0 0,1 890.5,1310.9 Z M 500.0,500.0 L 700.3,1377.4 A 900.0,900.0 0 0,1 500.0,1400.0 Z M 500.0,500.0 L 299.7,1377.4 A 900.0,900.0 0 0,1 109.5,1310.9 Z M 500.0,500.0 L -61.1,1203.6 A 900.0,900.0 0 0,1 -203.6,1061.1 Z M 500.0,500.0 L -310.9,890.5 A 900.0,900.0 0 0,1 -377.4,700.3 Z M 500.0,500.0 L -400.0,500.0 A 900.0,900.0 0 0,1 -377.4,299.7 Z M 500.0,500.0 L -310.9,109.5 A 900.0,900.0 0 0,1 -203.6,-61.1 Z M 500.0,500.0 L -61.1,-203.6 A 900.0,900.0 0 0,1 109.5,-310.9 Z M 500.0,500.0 L 299.7,-377.4 A 900.0,900.0 0 0,1 500.0,-400.0 Z M 500.0,500.0 L 700.3,-377.4 A 900.0,900.0 0 0,1 890.5,-310.9 Z M 500.0,500.0 L 1061.1,-203.6 A 900.0,900.0 0 0,1 1203.6,-61.1 Z M 500.0,500.0 L 1310.9,109.5 A 900.0,900.0 0 0,1 1377.4,299.7 Z" fill="url(#orangeWhiteRayGrad)" />
        </g>

        <!-- Vầng hào quang cam sữa dịu êm ở tâm sau lưng nhân vật -->
        <circle id="cartoon-halo-pulse" cx="500" cy="500" r="240" fill="url(#orangeWhiteCenterHalo)" />

        <!-- Hạt sao cam / vàng hổ phách nổi bật dễ thương trên nền trắng -->
        <g id="cartoon-sparkles-layer">
        <g transform="translate(280,320)"><path class="cartoon-sparkle" style="animation-delay: 0.0s;" d="M 0,-20 Q 0,0 20,0 Q 0,0 0,20 Q 0,0 -20,0 Q 0,0 0,-20 Z" fill="#FB923C" /></g>
        <g transform="translate(740,340)"><path class="cartoon-sparkle" style="animation-delay: 1.2s;" d="M 0,-22 Q 0,0 22,0 Q 0,0 0,22 Q 0,0 -22,0 Q 0,0 0,-22 Z" fill="#F59E0B" /></g>
        <g transform="translate(240,640)"><path class="cartoon-sparkle" style="animation-delay: 2.0s;" d="M 0,-18 Q 0,0 18,0 Q 0,0 0,18 Q 0,0 -18,0 Q 0,0 0,-18 Z" fill="#EA580C" /></g>
        <g transform="translate(720,680)"><path class="cartoon-sparkle" style="animation-delay: 0.8s;" d="M 0,-24 Q 0,0 24,0 Q 0,0 0,24 Q 0,0 -24,0 Q 0,0 0,-24 Z" fill="#F97316" /></g>
        <g transform="translate(500,180)"><path class="cartoon-sparkle" style="animation-delay: 1.6s;" d="M 0,-22 Q 0,0 22,0 Q 0,0 0,22 Q 0,0 -22,0 Q 0,0 0,-22 Z" fill="#F59E0B" /></g>
        <g transform="translate(360,800)"><path class="cartoon-sparkle" style="animation-delay: 2.4s;" d="M 0,-18 Q 0,0 18,0 Q 0,0 0,18 Q 0,0 -18,0 Q 0,0 0,-18 Z" fill="#FB923C" /></g>
        <g transform="translate(660,200)"><path class="cartoon-sparkle" style="animation-delay: 0.4s;" d="M 0,-16 Q 0,0 16,0 Q 0,0 0,16 Q 0,0 -16,0 Q 0,0 0,-16 Z" fill="#F97316" /></g>
        </g>
    </g>
</svg>